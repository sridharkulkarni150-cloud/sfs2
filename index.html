<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Rocket Sandbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="palette" aria-label="Part catalog"></aside>
    <main id="mainArea">
      <canvas id="gameCanvas"></canvas>
      <div id="hud">
        <div id="modeIndicator">BUILD</div>
        <div id="metrics"></div>
        <div id="telemetry"></div>
      </div>
      <div id="controls">
        <button id="launchBtn">Launch</button>
        <button id="resetBtn">Reset</button>
        <button id="saveBtn">Save</button>
        <button id="loadBtn">Load</button>
        <label>Throttle <input id="throttle" type="range" min="0" max="100" value="0" /></label>
        <button id="stageBtn">Stage</button>
        <label><input id="rcsToggle" type="checkbox" /> RCS</label>
      </div>
    </main>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
